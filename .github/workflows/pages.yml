name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "eshop/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig, laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pandoc installieren
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # Die Seite wird hier neu erzeugt, nicht die eingecheckte übernommen.
      # Damit kann die veröffentlichte Fassung nicht hinter den Kapiteln
      # zurückbleiben, wenn jemand build.py vor dem Commit vergessen hat.
      - name: Seite erzeugen
        run: python3 docs/build.py

      # Kein Byte-Vergleich mit der eingecheckten Seite: verschiedene
      # pandoc-Versionen erzeugen leicht unterschiedliches HTML (aeltere setzen
      # class="odd"/"even" auf Tabellenzeilen), der Vergleich schluege also
      # immer an. Stattdessen die Frage, um die es wirklich geht: wurde ein
      # Kapitel nach dem letzten Seitenbau veraendert?
      - name: Prüfen, ob die eingecheckte Seite aktuell war
        run: |
          seite=$(git log -1 --format=%ct -- docs/index.html)
          kapitel=$(git log -1 --format=%ct -- eshop/)
          if [ "$kapitel" -gt "$seite" ]; then
            echo "::warning file=docs/index.html::Die eingecheckte Seite ist aelter als die Kapitel. Veroeffentlicht wird der frisch gebaute Stand — bitte vor dem naechsten Commit 'python3 docs/build.py' ausfuehren."
          else
            echo "docs/index.html ist auf dem Stand der Kapitel."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
