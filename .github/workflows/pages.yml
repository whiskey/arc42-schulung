name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "eshop/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig, laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Feste Version statt des Distributionspakets: aeltere pandoc-Versionen
      # erzeugen leicht abweichendes HTML (class="odd"/"even" auf Tabellen-
      # zeilen). Mit dieser Bindung ist die veroeffentlichte Seite byteweise
      # dieselbe wie ein lokaler Build mit derselben Version.
      # Beim Anheben hier auch die lokale Version mitziehen.
      - name: pandoc installieren
        env:
          PANDOC_VERSION: "3.10.2"
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      # Die Seite wird hier neu erzeugt, nicht die eingecheckte übernommen.
      # Damit kann die veröffentlichte Fassung nicht hinter den Kapiteln
      # zurückbleiben, wenn jemand build.py vor dem Commit vergessen hat.
      - name: Seite erzeugen
        run: python3 docs/build.py

      # Kein Byte-Vergleich mit der eingecheckten Seite: verschiedene
      # pandoc-Versionen erzeugen leicht unterschiedliches HTML (aeltere setzen
      # class="odd"/"even" auf Tabellenzeilen), der Vergleich schluege also
      # immer an. Stattdessen die Frage, um die es wirklich geht: wurde ein
      # Kapitel nach dem letzten Seitenbau veraendert?
      - name: Prüfen, ob die eingecheckte Seite aktuell war
        run: |
          seite=$(git log -1 --format=%ct -- docs/index.html)
          kapitel=$(git log -1 --format=%ct -- eshop/)
          if [ "$kapitel" -gt "$seite" ]; then
            echo "::warning file=docs/index.html::Die eingecheckte Seite ist aelter als die Kapitel. Veroeffentlicht wird der frisch gebaute Stand — bitte vor dem naechsten Commit 'python3 docs/build.py' ausfuehren."
          else
            echo "docs/index.html ist auf dem Stand der Kapitel."
          fi
          if git diff --quiet docs/index.html; then
            echo "Der frische Build ist byteweise identisch mit der eingecheckten Seite."
          else
            echo "Hinweis: frischer Build weicht byteweise ab — pandoc-Version pruefen."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
